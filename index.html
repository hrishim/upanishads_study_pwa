<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ed">
  <title>Upanishads Study</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="study-app">
    <header class="library-topbar">
      <div class="app-heading">
        <h1>Upanishads Study</h1>
        <p class="source-line">Section headings · verses · word-by-word meaning · English translation · Shankara commentary</p>
      </div>

      <nav id="libraryList" class="library-list" aria-label="Upanishads"></nav>
      <label class="search-box top-search">
        <span>Search the full text</span>
        <input id="searchInput" aria-label="Search the current Upanishad" placeholder="Search Sanskrit, translation, word meanings..." type="search">
      </label>
    </header>

    <section class="study-main">
      <section class="stats" aria-label="Downloaded source summary">
        <div class="stat"><strong id="entryCount">0</strong><span>source entries</span></div>
        <div class="stat"><strong id="sectionCount">0</strong><span>sections</span></div>
        <div class="stat"><strong>4</strong><span>text layers</span></div>
        <div class="stat"><strong id="bookmarkCount">0</strong><span>bookmarks</span></div>
      </section>

      <section class="reader-layout">
        <aside class="panel structure-panel" aria-label="Structure">
          <div class="panel-header">
            <strong>Structure</strong>
            <span id="chapterCount">0 Mundakas</span>
          </div>
          <div id="tocList" class="toc-list"></div>
        </aside>

        <article class="panel read-panel">
          <div id="reader"></div>
        </article>

        <aside class="panel results-panel" aria-label="Search results and entries">
          <div class="panel-header">
            <strong id="resultsTitle">Section Verses</strong>
            <span id="resultsCount">0 entries</span>
          </div>
          <div id="resultsList" class="results-list"></div>
        </aside>
      </section>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
